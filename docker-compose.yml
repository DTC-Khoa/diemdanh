version: '3.8'

networks:
  app-net:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  app_logs:
  nginx_logs:

services:
  # ============================================================
  # 1. DATABASE MYSQL 8.0
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-attendance_db}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./app/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app-net
    restart: always

  # ============================================================
  # 2. PHPMYADMIN (QUAN TRI DATABASE TRUC QUAN)
  # ============================================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-net
    restart: always

  # ============================================================
  # 3. UNG DUNG WEB (NODE.JS EXPRESS + PROMETHEUS METRICS)
  # ============================================================
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: attendance_web
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:-rootpassword}
      - DB_NAME=${DB_NAME:-attendance_db}
      - PORT=3000
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:-attendance_dtc_super_secret_session_key_2026}
    volumes:
      - app_logs:/var/log/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-net
    restart: always

  # ============================================================
  # 4. NGINX REVERSE PROXY (CONG TRUY CAP CHINH WEBSITE)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - app-net
    restart: always

  # ============================================================
  # 5. EXPORTERS CHO GIAM SAT (NGINX & MYSQL EXPORTER)
  # ============================================================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx_exporter
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    depends_on:
      - nginx
    networks:
      - app-net
    restart: always

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysqld_exporter
    command:
      - --config.my-cnf=/etc/my.cnf
    volumes:
      - ./prometheus/my.cnf:/etc/my.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-net
    restart: always

  # ============================================================
  # 6. PROMETHEUS (HE THONG THU THAP & LUU TRU METRICS)
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - app-net
    restart: always

  # ============================================================
  # 7. GRAFANA (DASHBOARD TRUC QUAN HOA METRICS & LOGS)
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - app-net
    restart: always

  # ============================================================
  # 8. LOKI (HE THONG LUU TRU & TRUY VAN LOG TAP TRUNG)
  # ============================================================
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - app-net
    restart: always

  # ============================================================
  # 9. PROMTAIL (AGENTS THU THAP LOG TU WEB & NGINX CHUYEN LOKI)
  # ============================================================
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail.yaml:ro
      - app_logs:/var/log/app:ro
      - nginx_logs:/var/log/nginx:ro
    command: -config.file=/etc/promtail/promtail.yaml
    depends_on:
      - loki
    networks:
      - app-net
    restart: always
