# Cấu hình log format chi tiết có trường HTTP status và response time để Promtail dễ dàng scrape & Loki truy vấn LogQL
log_format detailed_json escape=json
  '{"time_local":"$time_local",'
  '"remote_addr":"$remote_addr",'
  '"request_method":"$request_method",'
  '"request_uri":"$request_uri",'
  '"status":$status,'
  '"body_bytes_sent":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"http_referrer":"$http_referer",'
  '"http_user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name localhost;

    # Ghi log chuẩn định dạng chi tiết
    access_log /var/log/nginx/app_access.log detailed_json;
    error_log /var/log/nginx/app_error.log warn;

    # Bảo mật Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tắt liệt kê thư mục & giới hạn kích thước request
    autoindex off;
    client_max_body_size 10M;

    # Chặn truy cập trực tiếp vào file nhạy cảm (.env, .git, .sql, config, etc.)
    location ~* /(\.git|\.env|Dockerfile|docker-compose|\.sql|\.bak|\.yml|\.yaml) {
        deny all;
        return 404;
    }

    # Nginx stub_status cho monitoring nội bộ
    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }

    # Reverse proxy tới container web Node.js
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout cấu hình hợp lý
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
